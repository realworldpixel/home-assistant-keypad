# -----------------------------------------------------------------------------
#  Key events - this is the interface Home Assistant should use
# -----------------------------------------------------------------------------
#  Exactly one of "press" or "long_press" arrives per key press, each with a
#  fresh timestamp, so rapid repeated taps each arrive separately. In HA these
#  are event entities: trigger on the state changing and branch on the
#  event_type attribute, which will only ever be one or the other.
#
#  If your ESPHome rejects `event.trigger`, the action is named `event.fire`
#  in some versions - same arguments.
# -----------------------------------------------------------------------------
event:
  - platform: template
    id: key1
    name: "Key 1"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key2
    name: "Key 2"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key3
    name: "Key 3"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key4
    name: "Key 4"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key5
    name: "Key 5"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key6
    name: "Key 6"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key7
    name: "Key 7"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key8
    name: "Key 8"
    device_class: button
    event_types:
      - press
      - long_press
  - platform: template
    id: key9
    name: "Key 9"
    device_class: button
    event_types:
      - press
      - long_press

# -----------------------------------------------------------------------------
#  Hold timers - one per key, so two keys can be held at the same time
# -----------------------------------------------------------------------------
#  Reaching the end of a script means that key was held past the threshold;
#  being stopped first means it was a tap. The event fires from inside the
#  script, which is why it lands mid-hold rather than on release.
# -----------------------------------------------------------------------------
script:
  - id: hold_1
    mode: restart
    then:
      - delay: ${long_press_ms}
      - event.trigger:
          id: key1
          event_type: long_press
  - id: hold_2
    mode: restart
    then:
      - delay: ${long_press_ms}
      - event.trigger:
          id: key2
          event_type: long_press
  - id: hold_3
    mode: restart
    then:
      - delay: ${long_press_ms}
      - event.trigger:
          id: key3
          event_type: long_press
  - id: hold_4
    mode: restart
    then:
      - delay: ${long_press_ms}
      - event.trigger:
          id: key4
          event_type: long_press
  - id: hold_5
    mode: restart
    then:
      - delay: ${long_press_ms}
      - event.trigger:
          id: key5
          event_type: long_press
  - id: hold_6
    mode: restart
    then:
      - delay: ${long_press_ms}
      - event.trigger:
          id: key6
          event_type: long_press
  - id: hold_7
    mode: restart
    then:
      - delay: ${long_press_ms}
      - event.trigger:
          id: key7
          event_type: long_press
  - id: hold_8
    mode: restart
    then:
