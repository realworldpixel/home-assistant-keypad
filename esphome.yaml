# -----------------------------------------------------------------------------
#  Buttons
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: gpio
    id: ch1
    name: "Button 1 held"
    internal: true
    pin:
      number: ${ch1_pin}
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_off: 5ms
    on_press:
      - script.execute: hold_1
    on_release:
      - if:
          condition:
            script.is_running: hold_1
          then:
            - event.trigger:
                id: key1
                event_type: press
      - script.stop: hold_1
