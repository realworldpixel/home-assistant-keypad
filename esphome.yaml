# =============================================================================
#  Seeed XIAO ESP32-C6  ·  9 × SK6812MINI-E  ·  9 × momentary switch
# =============================================================================
#  PASTE THIS WHOLE FILE UNDERNEATH THE CONFIG ESPHOME GENERATED FOR YOU.
#
#  It only contains the parts the wizard does not write, so nothing here
#  collides with the esphome / esp32 / logger / api / ota / wifi / captive_portal
#  blocks you already have. Leave those exactly as they are.
#
#  Hardware notes taken from the schematic:
#    · LED1..LED9 are daisy-chained (DOUT -> DIN), fed from D0 through R1.
#    · CH1..CH9 are momentary switches to GND. The internal pull-ups of
#      the ESP32-C6 are enabled and the inputs are inverted.
#
# =============================================================================

substitutions:
  long_press_ms: 1000ms    # how long a key must be held to count as a long press

  led_data_pin: GPIO0     # D0  -> R1 -> DIN of the first LED in the chain
  unused_pin: GPIO18      # D10 / MOSI - R11+D1 unpopulated, parked low

  # --- button pins -----------------------------------------------------------
  ch1_pin: GPIO20         # D9  / MISO
  ch2_pin: GPIO22         # D4  / SDA
  ch3_pin: GPIO1          # D1
  ch4_pin: GPIO19         # D8  / SCK
  ch5_pin: GPIO23         # D5  / SCL
  ch6_pin: GPIO2          # D2
  ch7_pin: GPIO17         # D7  / RX
  ch8_pin: GPIO16         # D6  / TX
  ch9_pin: GPIO21         # D3

  # --- position of each key's LED in the physical chain (0..8) ---------------
  led1_index: "6"
  led2_index: "5"
  led3_index: "0"
  led4_index: "7"
  led5_index: "4"
  led6_index: "1"
  led7_index: "8"
  led8_index: "3"
  led9_index: "2"

# On-board user LED. Solid = connected, blinking = wifi/API problem.
# Remove this block if you would rather keep the LED dark.
status_led:
  pin:
    number: GPIO15
    inverted: true

# Uncomment for a standalone control page at http://<device>/ (no HA needed).
# web_server:
#   version: 3

# -----------------------------------------------------------------------------
#  Outputs
# -----------------------------------------------------------------------------
output:
  - platform: gpio
    id: unused_d10
    pin: ${unused_pin}

# -----------------------------------------------------------------------------
#  Antenna
# -----------------------------------------------------------------------------
#  Both pins are driven low at boot, which powers the RF switch and selects the
#  on-board ceramic antenna. For the u.FL connector set antenna_select to
#  restore_mode: ALWAYS_ON.
# -----------------------------------------------------------------------------
switch:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
    internal: true
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: antenna_select
    pin: GPIO14
    internal: true
    restore_mode: ALWAYS_OFF

# -----------------------------------------------------------------------------
#  Lights - one entity per LED
# -----------------------------------------------------------------------------
#  The physical chain is declared first and kept internal; the nine partition
#  lights below each own exactly one pixel and are what you actually control.
# -----------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: led_chain
    name: "LED chain"
    internal: true
    pin: ${led_data_pin}
    num_leds: 9
    chipset: SK6812          # SK6812MINI-E timing
    channel_colors: GRB
    rmt_symbols: 48          # one RMT block on the C6; raise to 96 if flickery
    max_refresh_rate: 16ms   # ~60 Hz ceiling, keeps the RMT from being hammered
    restore_mode: ALWAYS_OFF
    default_transition_length: 0s

  - platform: partition
    id: led_1
    name: "LED 1"
    segments:
      - id: led_chain
        from: ${led1_index}
        to: ${led1_index}
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Slow Pulse"
          transition_length: 1s    # Time taken to fade in / fade out
          update_interval: 2s      # Total duration of one pulse cycle
          min_brightness: 10%
          max_brightness: 100%
      - pulse:
          name: "Fast Pulse"
          transition_length: 0.5s    # Time taken to fade in / fade out
          update_interval: 1s      # Total duration of one pulse cycle
          min_brightness: 10%
          max_brightness: 100%

  - platform: partition
    id: led_2
    name: "LED 2"
